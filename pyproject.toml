[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sextant"
version = "0.1.0"
description = "As-built and summary documentation generated from switches, firewalls and hypervisors."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hybrid Solutions AB" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-docx>=1.1",
  "weasyprint>=62",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "netmiko>=4.3",
  "paramiko>=3.4",
  "pysnmp>=7.1",
  "requests>=2.32",
  "pyvmomi>=8.0",
  "pywinrm>=0.4",
  "cryptography>=42",
  "cairosvg>=2.7",  # topology diagram -> PNG for Word
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
sextant = "sextant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008: Typer/FastAPI declare options as default-argument calls; long regexes are fine
