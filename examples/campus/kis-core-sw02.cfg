!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname kis-core-sw02
!
boot-start-marker
boot-end-marker
!
logging buffered 64000 informational
enable secret 9 <redacted>
!
aaa new-model
aaa group server tacacs+ ISE
 server name ise01
 server name ise02
aaa authentication login default group ISE local
aaa authorization exec default group ISE local
aaa accounting exec default start-stop group ISE
!
clock timezone CET 1 0
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
ip domain name corp.example
ip name-server 10.40.100.10 10.40.100.11
!
switch 1 provision c9500-24y4c
username netadmin privilege 15 secret 9 <redacted>
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree extend system-id

!
vlan 99
 name MGMT
!
vlan 999
 name NATIVE
!

interface Port-channel1
 description PEER kis-core-sw01 Po1
 no switchport
 ip address 10.40.30.2 255.255.255.252
!
interface TenGigabitEthernet1/0/1
 description P2P kis-dist-sw01 Te1/0/2
 no switchport
 ip address 10.40.41.1 255.255.255.252
 ip ospf network point-to-point
!
interface TenGigabitEthernet1/0/2
 description P2P kis-dist-sw02 Te1/0/2
 no switchport
 ip address 10.40.43.1 255.255.255.252
 ip ospf network point-to-point
!
interface TenGigabitEthernet1/0/3
 description P2P kis-dist-sw03 Te1/0/2
 no switchport
 ip address 10.40.45.1 255.255.255.252
 ip ospf network point-to-point
!
interface TenGigabitEthernet1/0/4
 description P2P kis-dist-sw04 Te1/0/2
 no switchport
 ip address 10.40.47.1 255.255.255.252
 ip ospf network point-to-point
!
interface TenGigabitEthernet1/0/5
 shutdown
!
interface TenGigabitEthernet1/0/6
 shutdown
!
interface TenGigabitEthernet1/0/7
 shutdown
!
interface TenGigabitEthernet1/0/8
 shutdown
!
interface TenGigabitEthernet1/0/9
 shutdown
!
interface TenGigabitEthernet1/0/10
 shutdown
!
interface TenGigabitEthernet1/0/11
 shutdown
!
interface TenGigabitEthernet1/0/12
 shutdown
!
interface TenGigabitEthernet1/0/13
 shutdown
!
interface TenGigabitEthernet1/0/14
 shutdown
!
interface TenGigabitEthernet1/0/15
 shutdown
!
interface TenGigabitEthernet1/0/16
 shutdown
!
interface TenGigabitEthernet1/0/17
 shutdown
!
interface TenGigabitEthernet1/0/18
 shutdown
!
interface TenGigabitEthernet1/0/19
 shutdown
!
interface TenGigabitEthernet1/0/20
 shutdown
!
interface TenGigabitEthernet1/0/21
 shutdown
!
interface TenGigabitEthernet1/0/22
 shutdown
!
interface TenGigabitEthernet1/0/23
 shutdown
!
interface TenGigabitEthernet1/0/24
 shutdown
!
interface HundredGigE1/0/25
 description PEER kis-core-sw01 Hu1/0/25
 no switchport
 channel-group 1 mode active
!
interface HundredGigE1/0/26
 description PEER kis-core-sw01 Hu1/0/26
 no switchport
 channel-group 1 mode active
!
interface TenGigabitEthernet1/0/24
 description WAN kis-fw01 port1
 no switchport
 ip address 10.40.20.9 255.255.255.252
!
interface Loopback0
 ip address 10.40.255.2 255.255.255.255
!
router ospf 1
 router-id 10.40.255.2
 network 10.40.0.0 0.0.255.255 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 10.40.20.10 name INTERNET

!
ip access-list standard MGMT
 10 permit 10.40.100.0 0.0.0.255
 20 deny   any log
ip access-list standard SNMP-RO
 10 permit 10.40.100.25
!
logging host 10.40.100.20
snmp-server community <redacted> RO SNMP-RO
snmp-server location Kista campus, datacenter
snmp-server contact noc@example.se
!
tacacs server ise01
 address ipv4 10.40.100.31
 key 7 <redacted>
tacacs server ise02
 address ipv4 10.40.100.32
 key 7 <redacted>
!
banner login ^C
Authorized access only. Activity is logged.
^C
!
line con 0
 exec-timeout 15 0
line vty 0 15
 access-class MGMT in
 exec-timeout 15 0
 transport input ssh
!
ntp server 10.40.100.5
ntp server 10.40.100.6
!
end
