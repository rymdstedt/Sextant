!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname kis-dist-sw01
!
boot-start-marker
boot-end-marker
!
logging buffered 64000 informational
enable secret 9 <redacted>
!
aaa new-model
aaa group server tacacs+ ISE
 server name ise01
 server name ise02
aaa authentication login default group ISE local
aaa authorization exec default group ISE local
aaa accounting exec default start-stop group ISE
!
clock timezone CET 1 0
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
ip domain name corp.example
ip name-server 10.40.100.10 10.40.100.11
!
switch 1 provision c9500-16x
username netadmin privilege 15 secret 9 <redacted>
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree extend system-id
spanning-tree vlan 1-4094 priority 4096
!
vlan 10
 name USERS
!
vlan 20
 name VOICE
!
vlan 30
 name PRINTERS
!
vlan 40
 name WLAN-AP
!
vlan 99
 name MGMT
!
vlan 998
 name PARKING
!
vlan 999
 name NATIVE
!

interface Port-channel1
 description PEER kis-dist-sw02 Po1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/1
 description P2P kis-core-sw01 Te1/0/1
 no switchport
 ip address 10.40.40.2 255.255.255.252
 ip ospf network point-to-point
!
interface TenGigabitEthernet1/0/2
 description P2P kis-core-sw02 Te1/0/1
 no switchport
 ip address 10.40.41.2 255.255.255.252
 ip ospf network point-to-point
!
interface TenGigabitEthernet1/0/3
 description PEER kis-dist-sw02 Te1/0/3
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
 channel-group 1 mode active
!
interface TenGigabitEthernet1/0/4
 description PEER kis-dist-sw02 Te1/0/4
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
 channel-group 1 mode active
!
interface TenGigabitEthernet1/0/5
 description DOWNLINK kis-acc-sw01 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/6
 description DOWNLINK kis-acc-sw02 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/7
 description DOWNLINK kis-acc-sw03 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/8
 description DOWNLINK kis-acc-sw04 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/9
 description DOWNLINK kis-acc-sw05 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/10
 description DOWNLINK kis-acc-sw06 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/11
 description DOWNLINK kis-acc-sw07 Te1/1/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport mode trunk
!
interface TenGigabitEthernet1/0/12
 shutdown
!
interface TenGigabitEthernet1/0/13
 shutdown
!
interface TenGigabitEthernet1/0/14
 shutdown
!
interface TenGigabitEthernet1/0/15
 shutdown
!
interface TenGigabitEthernet1/0/16
 shutdown
!
interface Vlan10
 description USERS
 ip address 10.41.10.2 255.255.255.0
 standby version 2
 standby 1 ip 10.41.10.1
 standby 1 priority 110
 standby 1 preempt
 ip helper-address 10.40.100.15
!
interface Vlan20
 description VOICE
 ip address 10.41.20.2 255.255.255.0
 standby version 2
 standby 1 ip 10.41.20.1
 standby 1 priority 110
 standby 1 preempt
 ip helper-address 10.40.100.15
!
interface Vlan30
 description PRINTERS
 ip address 10.41.30.2 255.255.255.0
 standby version 2
 standby 1 ip 10.41.30.1
 standby 1 priority 110
 standby 1 preempt
 ip helper-address 10.40.100.15
!
interface Vlan40
 description WLAN-AP
 ip address 10.41.40.2 255.255.255.0
 standby version 2
 standby 1 ip 10.41.40.1
 standby 1 priority 110
 standby 1 preempt
 ip helper-address 10.40.100.15
!
interface Vlan99
 description MGMT
 ip address 10.41.99.2 255.255.255.0
 standby version 2
 standby 1 ip 10.41.99.1
 standby 1 priority 110
 standby 1 preempt
 ip helper-address 10.40.100.15
!
interface Loopback0
 ip address 10.40.255.11 255.255.255.255
!
router ospf 1
 router-id 10.40.255.11
 passive-interface default
 no passive-interface TenGigabitEthernet1/0/1
 no passive-interface TenGigabitEthernet1/0/2
 network 10.40.0.0 0.0.255.255 area 0
 network 10.41.0.0 0.0.255.255 area 0
!
!
ip access-list standard MGMT
 10 permit 10.40.100.0 0.0.0.255
 20 deny   any log
ip access-list standard SNMP-RO
 10 permit 10.40.100.25
!
logging host 10.40.100.20
snmp-server community <redacted> RO SNMP-RO
snmp-server location Kista campus, building A, MDF
snmp-server contact noc@example.se
!
tacacs server ise01
 address ipv4 10.40.100.31
 key 7 <redacted>
tacacs server ise02
 address ipv4 10.40.100.32
 key 7 <redacted>
!
banner login ^C
Authorized access only. Activity is logged.
^C
!
line con 0
 exec-timeout 15 0
line vty 0 15
 access-class MGMT in
 exec-timeout 15 0
 transport input ssh
!
ntp server 10.40.100.5
ntp server 10.40.100.6
!
end
