services:
  sextant:
    image: ghcr.io/rymdstedt/sextant:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      SEXTANT_ADMIN_USER: ${SEXTANT_ADMIN_USER:-admin}
      SEXTANT_ADMIN_PASSWORD: ${SEXTANT_ADMIN_PASSWORD:?set SEXTANT_ADMIN_PASSWORD in .env}
      SEXTANT_SECRET_KEY: ${SEXTANT_SECRET_KEY:?set SEXTANT_SECRET_KEY in .env}
      # Set to 1 when served over HTTPS (behind a TLS reverse proxy)
      SEXTANT_HTTPS_ONLY: ${SEXTANT_HTTPS_ONLY:-0}
    volumes:
      - sextant-data:/data
    restart: unless-stopped

volumes:
  sextant-data:
