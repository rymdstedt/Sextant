<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ theme.product }}{% endblock %}</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/app.css">
{% if theme.logos.symbol %}<link rel="icon" href="/theme/{{ theme.logos.symbol }}">{% endif %}
</head>
<body>
{% if user %}
<header class="topbar">
  <a href="/" class="home">{% if theme.logos.white %}<img src="/theme/{{ theme.logos.white }}" alt="{{ theme.name }}">{% elif theme.company %}<span class="product">{{ theme.company }}</span>{% endif %}<span class="product">{{ theme.product }}</span></a>
  <nav>
    <a href="/" {% if nav == 'snapshots' %}aria-current="page"{% endif %}>Snapshots</a>
    <a href="/new" {% if nav == 'new' %}aria-current="page"{% endif %}>New documentation</a>
  </nav>
  <div class="user">
    <span>{{ user }}</span>
    <form method="post" action="/logout"><input type="hidden" name="token" value="{{ csrf }}"><button class="small">Log out</button></form>
  </div>
</header>
{% endif %}
<main>
{% if flash %}<div class="alert {{ flash.kind }}" role="status">{{ flash.text }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
