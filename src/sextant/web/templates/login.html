{% extends "base.html" %}
{% block title %}Log in · {{ theme.product }}{% endblock %}
{% block content %}
<div class="login">
  <div class="brand">{% if theme.logos.white %}<img src="/theme/{{ theme.logos.white }}" alt="{{ theme.name }}">{% else %}<span style="color:var(--on-primary);font-weight:700;font-size:20px">{{ theme.company or theme.product }}</span>{% endif %}</div>
  <form method="post" action="/login">
    <h2 style="margin-bottom:4px">{{ theme.product }}</h2>
    <p class="muted" style="margin-top:0">{{ theme.tagline }}</p>
    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="token" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="u">Username</label><input type="text" id="u" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input type="password" id="p" name="password" autocomplete="current-password" required></div>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
